{% load static %}

<!DOCTYPE html>
<html lang="en">
    <link rel="stylesheet" href="{% static 'CSS/chatStyle.css' %}">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>PALS</title>
    </head>

    <body>
        {% include "studentSystem/partials/session_navbar.html" %}
        
        <div id = "main">
            <div id = "conversationArea">
            </div>

            <div class = "inputArea">
                <textarea type="text" id="response" name="response" data-user-input="{{ user_input }}" rows="14" cols="10" wrap="soft"></textarea>
                <form onclick = 'update({{ chatID }})'>
                    {% csrf_token %}
                <input id="response_button" type="button" value="↑"><br>
                </form>
            </div>    
        </div>
        
        <script>
            const chatLog = JSON.parse('{{ chatLog|safe|escapejs }}');
            console.log(chatLog);
        </script>
        
        <script src="{% static 'JS/chat.js' %}"></script>

        <script>
            loadChat(chatLog);
        </script>
        
    </body>

</html>

{% load static %}

<!DOCTYPE html>
<html lang="en">
    <link rel="stylesheet" href="{% static 'CSS/chatStyle.css' %}">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>PALS</title>
    </head>

    <body>
        {% include "studentSystem/partials/session_navbar.html" %}
        
        <div id = "main">
            <div id = "conversationArea">
                    <div class="teacherArea">
                        <p>
                            Hello, I'm a programming assistant specialized in StandardML!
                            <br>
                            Let me know if you have any questions about the language, and I'm here to help!
                        </p>
                    </div>
            </div>

            <div class = "inputArea">
                <form id="response_form">
                    {% csrf_token %}
                    <textarea type="text" id="response" name="response" data-user-input="{{ user_input }}" rows="14" cols="10" wrap="soft"></textarea>
                    <input id="response_button" type="button" value="↑"><br>
                </form>
            </div>    
        </div>
        
        <script>
            const chatLog = JSON.parse('{{ chatLog|safe|escapejs }}');
            const sessionID = '{{ sessionID }}';
            console.log(chatLog);
        </script>
        
        <script src="{% static 'JS/chat.js' %}"></script>
        <script src="{% static 'JS/trackSiteTime.js' %}"></script>
        <script src="{% static 'JS/cursorAnalytics.js' %}"></script>

        <script>
            loadChat(chatLog);
        </script>
        
    </body>

</html>
